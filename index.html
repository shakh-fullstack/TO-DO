<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer src="./app.js"></script>
    <script defer src="./data.js"></script>
    <style>
      #input {
        padding: 8px, 12px;
        font-size: 16px;
        border: 2px solid #ccc;
        border-radius: 6px;
      }
      @keyframes rainbowBorder {
        0% {
          border-color: #ff3333;
        } /* Qizil */
        33% {
          border-color: #33cc33;
        } /* Yashil */
        66% {
          border-color: #3366ff;
        } /* Ko'k */
        100% {
          border-color: #ff3333;
        }
      }
      #input:focus {
        animation: rainbowBorder 4s infinite; /* 3 sekundda ranglar aylanib turadi */
        outline: none;
      }
      #addBtn {
        padding: 8px, 15px;
        font-size: 16px;
        border: 2px solid #e4e6eb;
        border-radius: 6px;
        cursor: pointer;
      }
      #clearAllBtn {
        padding: 8px, 15px;
        font-size: 15px;
        border-radius: 6px;
        border: 2px solid #e4e6eb;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>My TO-DO</h1>
    <button id="clearAllBtn">Clear All</button>
    <p>Vazifalar soni: <span id="count">0</span></p>
    <input type="text" placeholder="Nimadur yozing..." id="input" />
    <p id="errorText" style="color: red; display: none"></p>
    <button id="addBtn">Add Task</button>
    <div id="natija"></div>
  </body>
</html>
